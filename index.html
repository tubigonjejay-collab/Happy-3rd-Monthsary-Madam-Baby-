<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071b52">
<title>Our Little Blue Universe 💙</title>

<style>
:root{
  --blue:#168cff;
  --deep:#061640;
  --cyan:#62e9ff;
  --pink:#ff77c8;
  --purple:#8b6cff;
  --white:#f8fbff;
  --glass:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;background:#061640;overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
.page{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,rgba(98,233,255,.32),transparent 24%),
    radial-gradient(circle at 90% 18%,rgba(255,119,200,.28),transparent 25%),
    radial-gradient(circle at 45% 90%,rgba(139,108,255,.3),transparent 30%),
    linear-gradient(135deg,#04113b,#0a2d78 45%,#17165d 75%,#250d4e);
  position:relative;overflow:hidden;
}
#particles{position:fixed;inset:0;pointer-events:none;z-index:1}
.particle{
  position:absolute;bottom:-60px;opacity:.35;
  animation:rise linear infinite;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.5));
}
@keyframes rise{
  to{transform:translateY(-120vh) rotate(360deg);opacity:0}
}
section{position:relative;z-index:2}
.hidden{display:none!important}

/* Intro */
#intro{
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:28px 18px;text-align:center;
}
.intro-wrap{width:min(900px,100%)}
.kicker{
  letter-spacing:4px;text-transform:uppercase;font-size:.78rem;
  opacity:.72;margin-bottom:10px
}
h1{
  font-size:clamp(2.5rem,9vw,5.7rem);line-height:1.02;
  background:linear-gradient(90deg,#fff,#6fe9ff,#ff9ddd,#fff);
  background-size:300%;-webkit-background-clip:text;color:transparent;
  animation:gradient 6s ease infinite;
}
@keyframes gradient{50%{background-position:100%}}
.intro-sub{margin:18px auto 28px;max-width:650px;opacity:.85;line-height:1.7}

/* Vault */
.vault{
  width:min(310px,82vw);height:260px;margin:25px auto 28px;
  position:relative;border-radius:25px;
  background:linear-gradient(145deg,#aab9d5 0%,#42557e 42%,#151f3d 100%);
  border:8px solid #bdcbe4;
  box-shadow:inset 0 0 25px rgba(255,255,255,.2),0 0 45px rgba(0,205,255,.35),0 25px 70px rgba(0,0,0,.5);
  transition:1s;
}
.vault:after{
  content:"VAULT";position:absolute;top:18px;left:50%;transform:translateX(-50%);
  letter-spacing:5px;font-weight:800;color:#e8f1ff;font-size:.9rem
}
.vault.open{transform:scale(1.04);box-shadow:0 0 90px rgba(0,220,255,.8),0 0 140px rgba(255,100,220,.35)}
.vault-wheel{
  position:absolute;width:125px;height:125px;left:50%;top:60px;
  transform:translateX(-50%);
  border-radius:50%;border:12px solid #d7e2f5;
  background:radial-gradient(circle,#243663 0 27%,#7e91bd 29% 34%,#17254c 36% 53%,#a9b9df 55% 61%,#26365f 63% 100%);
  box-shadow:0 0 20px rgba(0,0,0,.5),inset 0 0 15px rgba(255,255,255,.3);
  transition:2s cubic-bezier(.2,.8,.2,1)
}
.vault.open .vault-wheel{transform:translateX(-50%) rotate(720deg)}
.riddle-card{
  max-width:650px;margin:auto;padding:24px;border:1px solid rgba(255,255,255,.2);
  border-radius:26px;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);
  box-shadow:0 18px 50px rgba(0,0,0,.25)
}
.riddle-card p{line-height:1.75}
.answer-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.answer-row input{
  width:min(330px,100%);padding:14px 18px;border:0;border-radius:999px;
  text-align:center;outline:none
}
.primary,.secondary{
  border:0;border-radius:999px;padding:13px 22px;color:white;font-weight:800;
  background:linear-gradient(90deg,#00bfff,#7567ff,#ff5fb8);
  box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s
}
.primary:hover,.secondary:hover{transform:translateY(-2px) scale(1.02)}
#error{min-height:24px;margin-top:10px;color:#ffd0ea}

/* Main */
#main{display:none}
section.content{padding:88px 18px;min-height:90svh}
.section-inner{width:min(1200px,100%);margin:auto}
.section-title{text-align:center;font-size:clamp(2.1rem,7vw,4rem);margin-bottom:10px}
.section-sub{text-align:center;opacity:.78;max-width:680px;margin:0 auto 38px;line-height:1.6}
.glass{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(18px);border-radius:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)
}

/* Music */
.music-card{max-width:760px;margin:auto;padding:35px;text-align:center}
.album{
  width:170px;height:170px;margin:0 auto 22px;border-radius:50%;
  display:grid;place-items:center;font-size:70px;
  background:radial-gradient(circle at 30% 25%,#fff,#7deaff 20%,#7c68ff 55%,#ff6ec4);
  box-shadow:0 0 45px rgba(0,210,255,.5);animation:pulse 2.4s infinite
}
@keyframes pulse{50%{transform:scale(1.05)}}
.song-title{font-size:1.8rem;font-weight:800}.artist{opacity:.7;margin:5px 0 22px}
.file-input{
  width:100%;padding:10px;background:white;color:#26345f;border-radius:12px;
  border:0;margin-bottom:16px
}
audio{width:100%}

/* Quiz Gifts */
.quiz-intro{
  max-width:700px;margin:0 auto 30px;text-align:center;line-height:1.7;opacity:.9
}
.gift-question{
  width:min(820px,100%);margin:0 auto 25px;padding:22px 24px;
  border:1px solid rgba(255,255,255,.18);border-radius:22px;
  background:rgba(255,255,255,.08);text-align:center;
}
.gift-question strong{color:#8fefff}
.quiz-progress{text-align:center;margin-top:22px;opacity:.8;font-size:.9rem}
.answer-reveal{
  margin:16px auto 0;padding:15px 18px;border-radius:16px;
  background:linear-gradient(135deg,rgba(22,140,255,.18),rgba(255,119,200,.18));
  border:1px solid rgba(255,255,255,.2);
}
.answer-reveal b{font-size:1.25rem;color:#fff}
.gift .gift-label{line-height:1.35}
.gift.opened{filter:saturate(.8)}
/* Gifts / Question Game */
const gifts=document.getElementById("gifts");
const quizProgress=document.getElementById("quizProgress");
let openedCount=0;

giftData.forEach((gift,index)=>{
  const el=document.createElement("div");
  el.className="gift";
  el.innerHTML=`
    <div class="gift-lid"></div>
    <div class="gift-box"></div>
    <div class="gift-label">
      ${gift.title}
      <div class="opened-badge">Tap to open</div>
    </div>`;
  el.addEventListener("click",()=>{
    if(el.classList.contains("opened")) return;
    el.classList.add("opened");
    openedCount++;
    quizProgress.textContent=`${openedCount} of ${giftData.length} gifts opened`;
    burst(35);
    setTimeout(()=>showGift(index),450);
  });
  gifts.appendChild(el);
});

function showGift(index){
  const gift=giftData[index];
  document.getElementById("giftTitle").textContent=gift.title;
  document.getElementById("giftText").textContent=gift.question;
  document.getElementById("giftAnswer").textContent=gift.answer;
  document.getElementById("answerReveal").classList.add("hidden");
  document.getElementById("revealAnswer").style.display="inline-block";
  document.getElementById("giftModal").style.display="flex";
}

document.getElementById("revealAnswer").addEventListener("click",()=>{
  document.getElementById("answerReveal").classList.remove("hidden");
  document.getElementById("revealAnswer").style.display="none";
  burst(20);
});

document.getElementById("closeGift").addEventListener("click",()=>{
  document.getElementById("giftModal").style.display="none";
});
document.getElementById("giftModal").addEventListener("click",e=>{
  if(e.target.id==="giftModal") document.getElementById("giftModal").style.display="none";
});

/* Message editor */
const display=document.getElementById("messageDisplay");
const editor=document.getElementById("messageEditor");
const input=document.getElementById("messageInput");

document.getElementById("editMessageBtn").addEventListener("click",()=>{
  input.value=display.textContent.trim();
  editor.classList.toggle("hidden");
});
document.getElementById("saveMessageBtn").addEventListener("click",()=>{
  display.textContent=input.value.trim();
  editor.classList.add("hidden");
  localStorage.setItem("loveMessage",input.value.trim());
});
const savedMessage=localStorage.getItem("loveMessage");
if(savedMessage) display.textContent=savedMessage;

/* Confetti */
function burst(count){
  for(let i=0;i<count;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.setProperty("--x",(Math.random()*500-250)+"px");
    c.style.setProperty("--y",(Math.random()*500-250)+"px");
    c.style.background=["#62e9ff","#ff77c8","#8b6cff","#fff","#ffd96a"][Math.floor(Math.random()*5)];
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1600);
  }
}
</script>
</div>
</body>
</html>
